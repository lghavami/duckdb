module: window
#-----------------------------------------------------------------------------------------------------------------------
# Handles
#-----------------------------------------------------------------------------------------------------------------------
handles:
  window_function:
    description: |
      An owned opaque handle to a custom window function being built. Created with `[[window_function_create]]`,
      configured with the setter functions (e.g. `[[window_function_set_name]]`), and destroyed with
      `[[window_function_destroy]]`.

#-----------------------------------------------------------------------------------------------------------------------
# Functions
#-----------------------------------------------------------------------------------------------------------------------
functions:
  #---------------------------------------------------------------------------------------------------------------------
  # Constructors
  #---------------------------------------------------------------------------------------------------------------------
  window_function_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-25" ]
    description: |
      Creates a new window function through a factory.

      The function starts out empty: configure it with the setter functions (e.g. `[[window_function_set_name]]`).
      The caller owns the returned handle and must destroy it with `[[window_function_destroy]]`.

    parameters:
      factory:
        type: factory
        description: The factory to create the window function through.
      function:
        type: window_function
        indirection: 1
        kind: OUT
        description: On success, receives the newly created window function. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Properties
  #---------------------------------------------------------------------------------------------------------------------
  window_function_set_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-25" ]
    description: |
      Sets the name of the window function.

      The name is borrowed and copied. Calling this again replaces the previous name.
    parameters:
      function:
        type: window_function
        description: The function to set the name of.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name to set. Borrowed and copied.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Destroy
  #---------------------------------------------------------------------------------------------------------------------
  window_function_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-25" ]
    description: |
      Destroys the window function, releasing its resources.

      Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to
      prevent double-destruction. Destroying the handle after registration does not affect the registered
      function.
    parameters:
      function:
        type: window_function
        description: The function to destroy.
        indirection: 1
    return_type: ERROR